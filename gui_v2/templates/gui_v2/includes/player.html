<div class="player {{ player_class }}" id="v2-player" role="region" aria-label="Avspillingsfelt">
  <audio id="v2-audio" preload="metadata"></audio>
  <div class="player-cover">♫</div>
  <div class="player-title" aria-live="polite">
    <strong data-player-title>Ingen lyd valgt</strong>
    <span data-player-subtitle>Velg Spill ved en innspilling</span>
  </div>
  <button type="button" disabled aria-label="Forrige">◀</button>
  <button class="play" type="button" data-player-toggle disabled aria-label="Spill av">▶</button>
  <button type="button" disabled aria-label="Neste">▶|</button>
  <button class="player-hide" type="button" data-player-hide aria-label="Skjul avspilleren" title="Skjul avspilleren">×</button>
  <input class="player-progress" data-player-progress type="range" min="0" max="0" value="0" step="0.1" aria-label="Avspillingsposisjon" disabled>
</div>
<button class="player-show" type="button" data-player-show aria-label="Vis avspilleren" title="Vis avspilleren" hidden>♫</button>
