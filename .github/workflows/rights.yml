name: P7 Rights foundation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            database: sqlite
            experimental: false
          - python: "3.14"
            database: postgres
            experimental: false
          - python: "3.15.0-rc.2"
            database: postgres
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: rights
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: rights
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rights -d rights"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DEBUG: "true"
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://rights:local-test-only@127.0.0.1:5432/rights' || 'sqlite:///ci.sqlite3' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python manage.py check
      - name: Verify pre-4.5A database upgrade
        run: python manage.py migrate media_assets 0003 --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - name: Full test suite
        run: python manage.py test
      - run: python scripts/smoke_admin.py
